<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend Face Recognition API</title>
</head>
<body>
    <h1>Test Frontend Face Recognition API</h1>
    <button onclick="testFaceCheck()">Test Face Registration Check</button>
    <div id="result"></div>

    <script>
        async function testFaceCheck() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/face-recognition', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'check-registration',
                        employee_id: '3917c798-a505-4109-9fac-9d5faef57c4a', // dattu
                    }),
                });

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>API Response:</h3>
                    <p><strong>Registered:</strong> ${data.registered}</p>
                    <p><strong>ML Service Available:</strong> ${data.mlServiceAvailable}</p>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <p><strong>Should show face modal:</strong> ${data.registered && data.mlServiceAvailable ? 'YES' : 'NO'}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
